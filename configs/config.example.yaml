app:
  name: go-auth-demo
  env: local
  host: 0.0.0.0
  port: 8080

http:
  request_timeout_seconds: 15
  read_timeout_seconds: 15
  write_timeout_seconds: 15
  idle_timeout_seconds: 60

auth:
  session:
    legacy_secret: change-me-legacy-secret
    secret: change-me-session-secret
    issuer: go-auth-demo
    ttl_hours: 24
    secure_cookie: false
    login_url: /login
    redirect_url: /docs

docs:
  enabled: true
  openapi_path: /openapi.json
  ui_path: /docs

log:
  level: info
  format: json
  output: stdout
  dir: logs
  filename: app.log
  max_size_mb: 100
  max_backups: 14
  max_age_days: 30
  compress: false
  rotate_daily: true
