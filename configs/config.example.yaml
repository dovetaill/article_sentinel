app:
  name: article-sentinel
  env: local
  host: 0.0.0.0
  port: 8080

http:
  # Application-level timeout used by the request middleware.
  request_timeout_seconds: 15
  read_timeout_seconds: 15
  write_timeout_seconds: 15
  idle_timeout_seconds: 60

redis:
  addr: 127.0.0.1:6380
  password: article_sentinel_redis
  db: 0
  pool_size: 10
  min_idle_conns: 2

database:
  # Starter 默认只使用这一份主数据库配置。
  driver: mysql
  mysql:
    host: 127.0.0.1
    port: 3307
    user: article_sentinel
    password: article_sentinel
    dbname: article_sentinel
    charset: utf8mb4
    parse_time: true
    loc: Local
    max_open_conns: 20
    max_idle_conns: 10
    conn_max_lifetime_minutes: 60
  postgres:
    host: 127.0.0.1
    port: 5432
    user: postgres
    password: postgres
    dbname: article_sentinel
    ssl_mode: disable
    time_zone: Asia/Shanghai
    max_open_conns: 20
    max_idle_conns: 10
    conn_max_lifetime_minutes: 60

auth:
  jwt:
    secret: change-me-in-production
    issuer: article-sentinel
    ttl_minutes: 120

queue:
  asynq:
    concurrency: 10
    queue_name: default
  outbox:
    enabled: true
    relay_spec: "@every 15s"
    batch_size: 20

scheduler:
  enabled: false
  spec: "@every 1m"

docs:
  # Set to false to disable both /openapi.json and /docs.
  enabled: true
  openapi_path: /openapi.json
  ui_path: /docs

log:
  level: info
  format: json
  output: both
  dir: logs
  filename: app.log
  max_size_mb: 100
  max_backups: 14
  max_age_days: 30
  compress: false
  rotate_daily: true
