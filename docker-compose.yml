services:
  mysql:
    image: mysql:8.4
    container_name: article-sentinel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: article_sentinel
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - article-sentinel-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: article-sentinel-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - article-sentinel-redis-data:/data

volumes:
  article-sentinel-mysql-data:
  article-sentinel-redis-data:
